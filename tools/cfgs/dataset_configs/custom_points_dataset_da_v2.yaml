DATASET: 'CustomDataset'
DATA_PATH: '../data/custom_points_ps_dataset_v2'

SHIFT_COOR: [0.0, 0.0, +0.0]
POINT_CLOUD_RANGE: [-75.2, -75.2, -3.0, 75.2, 75.2, 5.0]
MAX_SWEEPS: 1
EGO_REMOVE_RADIUS: 0.0
ALLOW_EMPTY_GT_BOXES: True

DATA_SPLIT: {
    'train': train,
    'test': train
}
SAMPLED_INTERVAL: {
    'train': 1,
    'test': 1
}
INFO_PATH: {
    'train': [custom_infos_train.pkl],
    'val': [custom_infos_val.pkl],
    'test': [custom_infos_train.pkl]
}

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'timestamp'],
    src_feature_list: ['x', 'y', 'z', 'intensity', 'timestamp'],
}

CLASS_NAMES: ['Vehicle', 'Pedestrian', 'Cyclist']
CLASS_MAPPING: {
    'car': 'Vehicle',
    'truck': 'Vehicle',
    'bus': 'Vehicle',
    'Vehicle': 'Vehicle',
    'motorcycle': 'Cyclist',
    'bicycle': 'Cyclist',
    'Cyclist': 'Cyclist',
    'pedestrian': 'Pedestrian',
    'Pedestrian': 'Pedestrian'
}

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['placeholder']
    AUG_CONFIG_LIST:
        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x', 'y']

        - NAME: random_world_rotation
          WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.95, 1.05]

DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True
      STRICT_MASK: True

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False
      }

    - NAME: transform_points_to_voxels_placeholder
      VOXEL_SIZE: [0.1, 0.1, 0.15]
