_BASE_CONFIG_: cfgs/nuscenes_models/uda_pv_rcnn_plusplus_resnet_anchorhead.yaml

DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/custom_points_dataset_da_v2.yaml
    MAX_SWEEPS: 1
    SAVE_PKL_IN_GROUND_FRAME: True
    CLASS_NAMES: ['Vehicle', 'Vehicle', 'Vehicle', 'Cyclist', 'Cyclist', 'Pedestrian']
    POINT_FEATURE_ENCODING: {
        encoding_type: absolute_coordinates_encoding,
        used_feature_list: ['x', 'y', 'z', 'timestamp'],
        src_feature_list: ['x', 'y', 'z', 'intensity', 'timestamp'],
    }
    DATA_PROCESSOR:
        - NAME: mask_points_and_boxes_outside_range
          REMOVE_OUTSIDE_BOXES: True
          STRICT_MASK: True

        - NAME: shuffle_points
          SHUFFLE_ENABLED: {
            'train': True,
            'test': False
          }

        - NAME: transform_points_to_voxels
          VOXEL_SIZE: [0.1, 0.1, 0.15]
          MAX_POINTS_PER_VOXEL: 5
          MAX_NUMBER_OF_VOXELS: {
            'train': 80000,
            'test': 90000
          }

DATA_CONFIG_TAR:
    _BASE_CONFIG_: cfgs/dataset_configs/custom_points_dataset_da_v2.yaml
    MAX_SWEEPS: 1
    TARGET: True
    USE_TTA: False
    USE_PSEUDO_LABEL: True
    USE_CUSTOM_TRAIN_SCENES: True
    SAVE_PKL_IN_GROUND_FRAME: True
    CLASS_NAMES: ['Vehicle', 'Vehicle', 'Vehicle', 'Cyclist', 'Cyclist', 'Pedestrian']
    POINT_FEATURE_ENCODING: {
        encoding_type: absolute_coordinates_encoding,
        used_feature_list: ['x', 'y', 'z', 'timestamp'],
        src_feature_list: ['x', 'y', 'z', 'intensity', 'timestamp'],
    }
    DATA_PROCESSOR:
        - NAME: mask_points_and_boxes_outside_range
          REMOVE_OUTSIDE_BOXES: True
          STRICT_MASK: True

        - NAME: shuffle_points
          SHUFFLE_ENABLED: {
            'train': True,
            'test': False
          }

        - NAME: transform_points_to_voxels
          VOXEL_SIZE: [0.1, 0.1, 0.15]
          MAX_POINTS_PER_VOXEL: 5
          MAX_NUMBER_OF_VOXELS: {
            'train': 80000,
            'test': 90000
          }

MODEL:
    POST_PROCESSING:
        EVAL_METRIC: None

SELF_TRAIN:
    INIT_PS: /MS3D/tools/cfgs/target_custom/label_generation/round1_nusc_pv_rcnn/ps_labels/final_pseudo_labels_ped_zfit_15m.pkl
