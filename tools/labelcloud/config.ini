[FILE]
pointcloud_folder = /MS3D/data/custom_dataset/training/velodyne/
label_folder = /MS3D/data/custom_dataset/labelcloud/labels/
class_definitions = /MS3D/tools/labelcloud/labels/_classes.json
calib_folder = /MS3D/data/custom_dataset/training/calib/
segmentation_folder = /MS3D/data/custom_dataset/labelcloud/segmentation/
image_folder = /MS3D/data/custom_dataset/training/image_2/

[POINTCLOUD]
point_size = 4.0
colorless_color = 0.9, 0.9, 0.9
colorless_colorize = True
std_translation = 0.03
std_zoom = 0.0025
color_with_label = True
label_color_mix_ratio = 0.3

[LABEL]
export_precision = 8
std_boundingbox_length = 0.80
std_boundingbox_width = 0.80
std_boundingbox_height = 1.80
std_translation = 0.03
std_rotation = 0.5
std_scaling = 0.03
min_boundingbox_dimension = 0.01
propagate_labels = False

[USER_INTERFACE]
z_rotation_only = True
show_floor = True
show_orientation = True
background_color = 100, 100, 100
viewing_precision = 2
near_plane = 0.1
far_plane = 300
keep_perspective = False
show_2d_image = False
delete_box_after_assign = True
